<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team 2FA Vault (Google Drive)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <div class="max-w-md mx-auto p-4 pb-20">
    <!-- Header -->
    <header class="flex items-center justify-between py-4 border-b border-slate-800">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🔐</span> Team 2FA Vault
      </h1>
      <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">
        Google Drive 連携中
      </span>
    </header>

    <!-- Lock Screen -->
    <div id="lockScreen" class="mt-8 bg-slate-800/80 p-6 rounded-2xl border border-slate-700/50 shadow-xl">
      <h2 class="text-lg font-bold mb-2">共有マスターパスワードの入力</h2>
      <p class="text-xs text-slate-400 mb-4">メンバー3名で共有している暗号化キー（パスワード）を入力してください。</p>

      <form id="formUnlock" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">マスターパスワード</label>
          <input type="password" id="inputMasterPassword" required placeholder="••••••••••••"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" id="btnUnlockSubmit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2">
          <span>ロック解除 & ドライブから同期</span>
        </button>
      </form>
    </div>

    <!-- Main Content (Hidden when locked) -->
    <div id="mainContent" class="hidden mt-6 space-y-4">
      
      <!-- Top Action Bar -->
      <div class="flex items-center justify-between">
        <div class="text-xs text-slate-400 flex items-center gap-1.5">
          <span id="syncStatus" class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="syncText">同期済み</span>
        </div>
        <div class="flex gap-2">
          <button id="btnManualSync" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-lg border border-slate-700">
            🔄 再読み込み
          </button>
          <button id="btnAdd" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1 shadow">
            <span>＋</span> 2FA追加
          </button>
        </div>
      </div>

      <!-- Countdown Progress -->
      <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/40 flex items-center justify-between">
        <span class="text-xs text-slate-400">コード更新まで</span>
        <div class="flex items-center gap-2">
          <div class="w-24 bg-slate-700 h-2 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-indigo-500 h-full transition-all duration-1000 ease-linear" style="width: 100%;"></div>
          </div>
          <span id="timerText" class="text-xs font-mono font-bold text-indigo-400 w-6 text-right">30s</span>
        </div>
      </div>

      <!-- 2FA List -->
      <div id="otpList" class="space-y-3">
        <!-- Dynamic OTP Cards -->
      </div>
    </div>
  </div>

  <!-- Modal: Add 2FA -->
  <dialog id="modalAdd" class="bg-slate-800 text-slate-100 rounded-2xl p-6 border border-slate-700 max-w-sm w-full backdrop:bg-black/60">
    <h3 class="text-base font-bold mb-4">新しい2FAアカウントの追加</h3>
    <form id="formAdd" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">サービス名 (例: AWS, GitHub)</label>
        <input type="text" id="addService" required placeholder="例: Shared AWS" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">アカウント名 / メモ (任意)</label>
        <input type="text" id="addAccount" placeholder="例: admin@company.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">シークレットキー (Base32)</label>
        <input type="text" id="addSecret" required placeholder="JBSWY3DPEHPK3PXP" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-white uppercase">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="document.getElementById('modalAdd').close()" class="px-4 py-2 text-xs text-slate-400 hover:text-white">キャンセル</button>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 text-xs font-semibold rounded-lg text-white">保存 & 同期</button>
      </div>
    </form>
  </dialog>

  <script>
    // --- Google Apps Script Web App URL ---
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzAXSuvBObCp_25PBvtrBIWlUDQNxH4u81-6colW5AeqHQ3iSoK4YkCRTmAlDm1HgJR/exec";

    // --- State & Variables ---
    let masterPassword = "";
    let vaultItems = [];

    // --- Crypto Helpers (PBKDF2 + AES-256-GCM) ---
    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("password", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(dataObj, password) {
